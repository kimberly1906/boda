<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrés & Kimberly - RSVP Boda</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Caveat:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --color-teal: #0b5a75; --color-pink: #f2a2bc; --color-dark: #1d1516; --color-terracotta: #b3644f; --color-cream: #faf6f0; --color-white: #ffffff; --color-gray: #7a7575; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--color-cream); color: var(--color-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 10px; }
        .card { background-color: var(--color-white); border-radius: 24px; box-shadow: 0 15px 40px rgba(29, 21, 22, 0.08); max-width: 550px; width: 100%; overflow: hidden; border: 1px solid rgba(242, 162, 188, 0.2); }
        .content { padding: 30px 25px; }
        .itinerary-info { background-color: #fcfbfa; border: 1px solid #eae6e1; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .itinerary-title { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--color-teal); margin-bottom: 12px; font-weight: bold; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: var(--color-dark); }
        input[type="text"], select, textarea { width: 100%; padding: 12px 16px; border: 2px solid #e1dbd6; border-radius: 12px; font-family: 'Montserrat', sans-serif; }
        .assistance-toggle { display: flex; gap: 15px; }
        .assistance-option { flex: 1; border: 2px solid #e1dbd6; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; }
        .assistance-option input { display: none; }
        .assistance-option.selected-yes { border-color: var(--color-teal); background-color: rgba(11, 90, 117, 0.05); color: var(--color-teal); }
        .assistance-option.selected-no { border-color: var(--color-pink); background-color: rgba(242, 162, 188, 0.05); color: #d1567d; }
        .conditional-section { max-height: 3000px; opacity: 1; transition: all 0.5s ease-in-out; }
        .conditional-section.hidden { max-height: 0; opacity: 0; pointer-events: none; }
        .contenedor-menus-dinamicos { background-color: #f7f9fa; border-left: 4px solid var(--color-teal); padding: 15px; border-radius: 0 12px 12px 0; }
        .btn-submit { background-color: var(--color-teal); color: var(--color-white); border: none; border-radius: 12px; width: 100%; padding: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .footer-note { text-align: center; margin-top: 25px; font-size: 0.8rem; color: var(--color-gray); }
    </style>
</head>
<body>

<div class="card">
    <div style="width: 100%; line-height: 0;"><img src="invitacion.jpg" alt="Invitación" style="width: 100%; height: auto;"></div>
    <div class="content">
        <div class="itinerary-info">
            <div class="itinerary-title"><i class="fa-solid fa-location-dot"></i> Ceremonia & Banquete</div>
            <p>19:00 h Llegada<br>19:30 h Ceremonia en El Fogón de la Casona</p>
        </div>

        <form id="rsvp-form">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nombre</label>
                <input type="text" id="name" required placeholder="Nombre y Apellidos">
            </div>

            <div class="form-group">
                <label>¿Podrás asistir?</label>
                <div class="assistance-toggle">
                    <label class="assistance-option selected-yes" id="opt-yes"><input type="radio" name="attendance" value="Sí" checked onclick="toggleSection(true)"> Sí 🎉</label>
                    <label class="assistance-option" id="opt-no"><input type="radio" name="attendance" value="No" onclick="toggleSection(false)"> No 😔</label>
                </div>
            </div>

            <div class="conditional-section" id="extra-info">
                <div class="form-group">
                    <label>¿Cuántos seréis?</label>
                    <select id="guests" onchange="generarCamposMenu(this.value)">
                        <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Menú:</label>
                    <div id="contenedor-menus" class="contenedor-menus-dinamicos"></div>
                </div>
                <div class="form-group">
                    <label>Alergias / Notas</label>
                    <textarea id="allergies" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Autobús</label>
                    <select id="bus">
                        <option value="No necesito">No necesito autobús</option>
                        <option value="Alcorcón">Alcorcón (17:30)</option>
                        <option value="Moncloa">Moncloa (18:15)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Enviar Confirmación</button>
        </form>
        <div class="footer-note">Hecho con amor para Andrés & Kimberly.</div>
    </div>
</div>

<script>
    function toggleSection(willAttend) {
        document.getElementById('extra-info').classList.toggle('hidden', !willAttend);
        document.getElementById('opt-yes').classList.toggle('selected-yes', willAttend);
        document.getElementById('opt-no').classList.toggle('selected-no', !willAttend);
    }

    function generarCamposMenu(n) {
        const cont = document.getElementById('contenedor-menus');
        cont.innerHTML = '';
        for (let i = 1; i <= n; i++) {
            cont.innerHTML += `<div>Persona ${i}: <b>Menú Vegetariano 🌿</b></div><input type="hidden" class="menu-select" value="Vegetariano">`;
        }
    }
    generarCamposMenu(2);

    document.getElementById('rsvp-form').addEventListener('submit', function(e) {
        e.preventDefault();
        let msg = `RSVP Boda: ${document.getElementById('name').value}\nAsistencia: ${document.querySelector('input[name="attendance"]:checked').value}\n`;
        const linkGrupo = "https://chat.whatsapp.com/EbGWIWT6Wew8g1Ek63fYXj?s=cl&p=a&ilr=4";
        window.open(`${linkGrupo}?text=${encodeURIComponent(msg)}`, '_blank');
    });
</script>
</body>
</html>
