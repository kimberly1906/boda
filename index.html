<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrés & Kimberly - RSVP Boda</title>
   
    <!-- Fuentes y Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Caveat:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --color-teal: #0b5a75;      
            --color-pink: #f2a2bc;      
            --color-dark: #1d1516;      
            --color-terracotta: #b3644f;
            --color-cream: #faf6f0;      
            --color-white: #ffffff;
            --color-gray: #7a7575;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-cream);
            color: var(--color-dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card {
            background-color: var(--color-white);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(29, 21, 22, 0.08);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(242, 162, 188, 0.2);
        }

        .content { padding: 30px 25px; }

        .itinerary-info {
            background-color: #fcfbfa;
            border: 1px solid #eae6e1;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .itinerary-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--color-teal);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .itinerary-item { display: flex; margin-bottom: 10px; font-size: 0.9rem; align-items: flex-start; }
        .itinerary-time { font-weight: 600; color: var(--color-terracotta); min-width: 75px; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: var(--color-dark); }
        .form-group label i { color: var(--color-teal); margin-right: 6px; }

        input[type="text"], select, textarea {
            width: 100%; padding: 12px 16px; border: 2px solid #e1dbd6;
            border-radius: 12px; font-family: 'Montserrat', sans-serif; font-size: 0.95rem;
            color: var(--color-dark); background-color: var(--color-white);
        }

        .assistance-toggle { display: flex; gap: 15px; }
        .assistance-option { flex: 1; border: 2px solid #e1dbd6; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; }
        .assistance-option input { display: none; }
        .assistance-option.selected-yes { border-color: var(--color-teal); background-color: rgba(11, 90, 117, 0.05); color: var(--color-teal); }
        .assistance-option.selected-no { border-color: var(--color-pink); background-color: rgba(242, 162, 188, 0.05); color: #d1567d; }

        .conditional-section, .bus-conditional { max-height: 3000px; opacity: 1; transition: all 0.4s ease; overflow: hidden; }
        .hidden { max-height: 0; opacity: 0; pointer-events: none; margin-bottom: 0; }

        .contenedor-menus-dinamicos { background-color: #f7f9fa; border-left: 4px solid var(--color-teal); padding: 15px; border-radius: 0 12px 12px 0; margin-bottom: 22px; }
        .subgrupo-menu { margin-bottom: 12px; }

        .btn-submit {
            background-color: var(--color-teal); color: var(--color-white); border: none; border-radius: 12px;
            width: 100%; padding: 16px; font-size: 1rem; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;
        }
        .footer-note { text-align: center; margin-top: 25px; font-size: 0.8rem; color: var(--color-gray); }
    </style>
</head>
<body>

<div class="card">
    <div style="width: 100%; line-height: 0;">
        <img src="invitacion.jpg" alt="Invitación Andrés y Kimberly" style="width: 100%; height: auto; display: block;">
    </div>

    <div class="content">
        <div class="itinerary-info">
            <div class="itinerary-title"><i class="fa-solid fa-location-dot"></i> Ceremonia & Banquete</div>
            <div class="itinerary-item"><span class="itinerary-time">19:00 h</span> <span>Llegada de invitados</span></div>
            <div class="itinerary-item"><span class="itinerary-time">19:30 h</span> <span>Ceremonia en El Fogón de la Casona</span></div>
        </div>

        <form id="rsvp-form">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Nombre Completo / Familia</label>
                <input type="text" id="name" name="name" placeholder="Ej: Juan Pérez y Ana Gómez" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope-open-text"></i> ¿Podrás acompañarnos?</label>
                <div class="assistance-toggle">
                    <label class="assistance-option selected-yes" id="opt-yes">
                        <input type="radio" name="attendance" value="Sí, asistiré" checked onclick="toggleSection(true)">
                        <span>¡Sí, asistiré! 🎉</span>
                    </label>
                    <label class="assistance-option" id="opt-no">
                        <input type="radio" name="attendance" value="No podré asistir" onclick="toggleSection(false)">
                        <span>No podré asistir 😔</span>
                    </label>
                </div>
            </div>

            <div class="conditional-section" id="extra-info">
                <div class="form-group">
                    <label for="guests"><i class="fa-solid fa-users"></i> ¿Cuántos vendréis en total?</label>
                    <select id="guests" name="guests" onchange="generarCamposMenu(this.value)">
                        <option value="1">1 Persona</option>
                        <option value="2" selected>2 Personas</option>
                        <option value="3">3 Personas</option>
                        <option value="4">4 Personas</option>
                        <option value="5">5 Personas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-utensils"></i> Selección de menú:</label>
                    <div id="contenedor-menus" class="contenedor-menus-dinamicos"></div>
                </div>

                <div class="form-group">
                    <label for="allergies"><i class="fa-solid fa-circle-exclamation"></i> Alergias o notas alimentarias</label>
                    <textarea id="allergies" name="allergies" rows="2" placeholder="Ej: Persona 1 es celíaca..."></textarea>
                </div>

                <div class="form-group">
                    <label for="bus"><i class="fa-solid fa-bus"></i> Servicio de Autobús</label>
                    <select id="bus" name="bus" onchange="evaluarPreguntaBus(this.value)">
                        <option value="No necesito autobús">🚗 No necesito autobús</option>
                        <option value="Ida y Vuelta - Alcorcón Central (17:20)">🚌 Sí, Alcorcón (Ida 17:20 / Vuelta 05:15)</option>
                        <option value="Ida y Vuelta - Moncloa (18:00)">🚌 Sí, Moncloa (Ida 18:00 / Vuelta 05:15)</option>
                        <option value="Solo Vuelta (05:15)">🌙 Solo autobús de regreso (05:15)</option>
                    </select>
                   
                    <div id="bus-plazas-container" class="bus-conditional hidden">
                        <label for="bus-seats" style="margin-top: 10px; font-size: 0.85rem; color: #4a4a4a;">
                            <i class="fa-solid fa-ticket"></i> ¿Plazas en el autobús?
                        </label>
                        <select id="bus-seats" name="bus-seats">
                            <option value="1">1 Plaza</option>
                            <option value="2" selected>2 Plazas</option>
                            <option value="3">3 Plazas</option>
                            <option value="4">4 Plazas</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Selector de Destinatario -->
            <div class="form-group" style="margin-top: 25px; border-top: 1px solid #e1dbd6; padding-top: 20px;">
                <label for="destinatario"><i class="fa-solid fa-paper-plane"></i> Enviar mi confirmación a:</label>
                <select id="destinatario" name="destinatario">
                    <option value="andres">Andrés</option>
                    <option value="kimberly">Kimberly</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-brands fa-whatsapp"></i> Enviar Confirmación por WhatsApp
            </button>
        </form>

        <!-- IMAGEN AL FINAL -->
        <div style="margin-top: 30px; width: 100%; display: block;">
            <img src="fotofinal.jpg" alt="Foto final" style="width: 100%; height: auto; border-radius: 12px; display: block; margin: 0 auto;">
        </div>

        <div class="footer-note">Hecho con <i class="fa-solid fa-heart"></i> para Andrés & Kimberly.</div>
    </div> <!-- ESTE ES EL CIERRE DEL DIV .CONTENT QUE DEBE IR DESPUÉS DE LA FOTO -->
</div> <!-- ESTE ES EL CIERRE DEL DIV .CARD -->


<script>
    const optYes = document.getElementById('opt-yes');
    const optNo = document.getElementById('opt-no');

    function toggleSection(willAttend) {
        const extraSection = document.getElementById('extra-info');
        if (willAttend) {
            extraSection.classList.remove('hidden');
            optYes.classList.add('selected-yes');
            optNo.classList.remove('selected-no');
        } else {
            extraSection.classList.add('hidden');
            optYes.classList.remove('selected-yes');
            optNo.classList.add('selected-no');
        }
    }

    function evaluarPreguntaBus(opcion) {
        const contenedor = document.getElementById('bus-plazas-container');
        opcion === "No necesito autobús" ? contenedor.classList.add('hidden') : contenedor.classList.remove('hidden');
    }

    function generarCamposMenu(numeroPersonas) {
        const contenedor = document.getElementById('contenedor-menus');
        contenedor.innerHTML = '';
        for (let i = 1; i <= numeroPersonas; i++) {
            const div = document.createElement('div');
            div.className = 'subgrupo-menu';
            div.innerHTML = `<label>Menú para Persona ${i}:</label>
                <select class="menu-persona-select" data-persona="${i}">
                    <option value="Carne 🥩">Menú de Carne 🥩</option>
                    <option value="Pescado 🐟">Menú de Pescado 🐟</option>
                    <option value="Vegetariano 🌿">Menú Vegetariano 🌿</option>
                    <option value="Infantil 🧒">Menú Infantil 🧒</option>
                </select>`;
            contenedor.appendChild(div);
        }
    }
    generarCamposMenu(2);

    document.getElementById('rsvp-form').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Configuración de números (CAMBIAR AQUÍ)
        const numeros = {
            andres: "34679793713", // Pon el móvil de Andrés aquí
            kimberly: "34675163263" // Pon el móvil de Kimberly aquí
        };
        const telefonoElegido = numeros[document.getElementById('destinatario').value];

        // 2. Construcción mensaje
        const name = document.getElementById('name').value;
        const attendance = document.querySelector('input[name="attendance"]:checked').value;
        let message = `💍 *RSVP BODA: Andrés & Kimberly* 💍\n\n👤 *Nombre:* ${name}\n💌 *Asistencia:* ${attendance}\n`;

        if (attendance === "Sí, asistiré") {
            message += `👥 *Nº de Invitados:* ${document.getElementById('guests').value}\n\n🍽️ *Elección de Menús:*\n`;
            document.querySelectorAll('.menu-persona-select').forEach(s => {
                message += ` • Persona ${s.getAttribute('data-persona')}: ${s.value}\n`;
            });
            message += `⚠️ *Alergias/Notas:* ${document.getElementById('allergies').value || "Ninguna"}\n\n`;
            
            const bus = document.getElementById('bus').value;
            if (bus === "No necesito autobús") {
                message += `🚌 *Autobús:* No necesita\n`;
            } else {
                message += `🚌 *Autobús:* ${bus}\n🎟️ *Plazas:* ${document.getElementById('bus-seats').value}\n`;
            }
        } else {
            message += `😔 Lamentablemente no podré asistir.`;
        }

        window.open(`https://api.whatsapp.com/send?phone=${telefonoElegido}&text=${encodeURIComponent(message)}`, '_blank');
    });
</script>
</body>
</html>
